<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Account — AcademicIQ</title>
<link rel="stylesheet" href="signup.css">
</head>
<body>

<header class="top-bar">
  <a href="index.html" class="back-link">← Back</a>
  <div class="logo">
    <div class="logo-icon">🎓</div>
    Academic<span class="iq">IQ</span>
  </div>
  <div class="spacer"></div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="subtitle">Start analyzing your academic performance in minutes.</p>

    <form id="signupForm">
      <div class="field">
        <label for="fullname">Full name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Jordan Smith" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@university.edu" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" required>
          <button type="button" class="toggle-password" data-target="password" aria-label="Show password">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-submit">Create Account →</button>
      <p class="switch-auth">Already have an account? <a href="signin.html">Sign In</a></p>
    </form>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
