<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — AcademicIQ</title>
<link rel="stylesheet" href="signin.css">
</head>
<body>

<header class="top-bar">
  <a href="index.html" class="back-link">← Back</a>
  <div class="logo">
    <div class="logo-icon">🎓</div>
    Academic<span class="iq">IQ</span>
  </div>
  <div class="spacer"></div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to your AcademicIQ dashboard.</p>

    <form id="signinForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@university.edu" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" required>
          <button type="button" class="toggle-password" data-target="password" aria-label="Show password">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-submit">Sign In →</button>
    </form>

    <p class="switch-auth">New to AcademicIQ? <a href="signup.html">Create an account</a></p>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
